<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MagToMP - Cloud Video Dispatcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131b2e;
      --card-border: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-grad: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --error: #ef4444;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 620px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .header {
      text-align: center;
      padding: 1rem 0;
    }

    .header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .card {
      background-color: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-bottom: 1.2rem;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .label-hint {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    input, textarea {
      width: 100%;
      background-color: #0b0f19;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 0.8rem 1rem;
      color: var(--text);
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .btn {
      width: 100%;
      padding: 0.9rem 1.5rem;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background: var(--accent-grad);
      color: white;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .settings-toggle {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 0.5rem;
    }

    .settings-toggle:hover {
      color: var(--text);
    }

    .settings-box {
      display: none;
      background: #0b0f19;
      border: 1px dashed #334155;
      padding: 1rem;
      border-radius: 10px;
      margin-bottom: 1.2rem;
    }

    .status-card {
      display: none;
      background: #1e293b;
      border-radius: var(--radius);
      padding: 1.2rem;
      border-left: 4px solid var(--accent);
    }

    .status-title {
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 0.3rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-msg {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .status-link {
      display: inline-block;
      margin-top: 0.6rem;
      color: #38bdf8;
      font-size: 0.85rem;
      text-decoration: none;
      font-weight: 600;
    }

    .status-link:hover {
      text-decoration: underline;
    }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .badge-in_progress { background: #3b82f6; color: white; }
    .badge-queued { background: #f59e0b; color: white; }
    .badge-completed { background: #10b981; color: white; }
    .badge-failure { background: #ef4444; color: white; }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>⚡ MagToMP Web Dispatcher</h1>
      <p>Dispatch video processing jobs to dedicated 7GB GitHub Actions runners.</p>
    </div>

    <div class="card">
      <button class="settings-toggle" id="toggleSettings" type="button">
        ⚙️ <span>GitHub Settings & Auth Token</span>
      </button>

      <div class="settings-box" id="settingsBox">
        <div class="form-group">
          <label for="ghToken">
            GitHub Personal Access Token (PAT)
            <span class="label-hint"><a href="https://github.com/settings/tokens/new?scopes=repo,workflow" target="_blank" style="color: #38bdf8; text-decoration: none;">Create token (repo scope) ↗</a></span>
          </label>
          <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
        </div>

        <div class="form-group">
          <label for="ghRepo">GitHub Repository</label>
          <input type="text" id="ghRepo" value="webbusiness4/magtomp">
        </div>
      </div>

      <form id="dispatchForm">
        <div class="form-group">
          <label for="videoUrl">
            📥 Video Link (Magnet, Seedr, PikPak, Debrid)
            <span class="label-hint">Required</span>
          </label>
          <textarea id="videoUrl" placeholder="magnet:?xt=urn:btih:... OR https://dl-a10b-1553.mypikpak.com/download/?fid=..." required></textarea>
        </div>

        <div class="form-group">
          <label for="videoTitle">
            📝 Video Title
            <span class="label-hint">Auto-detected if left empty</span>
          </label>
          <input type="text" id="videoTitle" placeholder="e.g. My Movie 1080p">
        </div>

        <div class="form-group">
          <label for="posterUrl">🖼️ Poster Image URL (Optional)</label>
          <input type="url" id="posterUrl" placeholder="https://example.com/poster.jpg">
        </div>

        <div class="form-group">
          <label for="tags">🏷️ Tags (Saved to Supabase 'cast_members')</label>
          <input type="text" id="tags" placeholder="Action, HD, 1080p, Scene">
        </div>

        <div class="form-group">
          <label for="description">📄 Description (Optional)</label>
          <textarea id="description" placeholder="Short description for Supabase..." rows="2"></textarea>
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">
          <span>🚀 Dispatch to GitHub Actions (7GB VM)</span>
        </button>
      </form>
    </div>

    <div class="status-card" id="statusCard">
      <div class="status-title" id="statusTitle">
        <span>🔄 Workflow Dispatched</span>
      </div>
      <div class="status-msg" id="statusMsg">Spawning dedicated cloud virtual machine...</div>
      <a href="#" class="status-link" id="statusLink" target="_blank" style="display: none;">👉 View Live Actions Terminal Logs ↗</a>
    </div>
  </div>

  <script>
    // Storage & DOM Elements
    const tokenInput = document.getElementById('ghToken');
    const repoInput = document.getElementById('ghRepo');
    const toggleSettings = document.getElementById('toggleSettings');
    const settingsBox = document.getElementById('settingsBox');
    const form = document.getElementById('dispatchForm');
    const submitBtn = document.getElementById('submitBtn');
    const urlInput = document.getElementById('videoUrl');
    const titleInput = document.getElementById('videoTitle');
    const posterInput = document.getElementById('posterUrl');
    const tagsInput = document.getElementById('tags');
    const descInput = document.getElementById('description');
    
    const statusCard = document.getElementById('statusCard');
    const statusTitle = document.getElementById('statusTitle');
    const statusMsg = document.getElementById('statusMsg');
    const statusLink = document.getElementById('statusLink');

    // Load saved settings
    tokenInput.value = localStorage.getItem('magtomp_gh_token') || '';
    repoInput.value = localStorage.getItem('magtomp_gh_repo') || 'webbusiness4/magtomp';

    if (!tokenInput.value) {
      settingsBox.style.display = 'block';
    }

    toggleSettings.addEventListener('click', () => {
      settingsBox.style.display = settingsBox.style.display === 'block' ? 'none' : 'block';
    });

    tokenInput.addEventListener('input', () => localStorage.setItem('magtomp_gh_token', tokenInput.value.trim()));
    repoInput.addEventListener('input', () => localStorage.setItem('magtomp_gh_repo', repoInput.value.trim()));

    // Auto title extraction
    urlInput.addEventListener('input', () => {
      const val = urlInput.value.trim();
      if (!titleInput.value) {
        if (val.startsWith('magnet:?')) {
          const match = val.match(/dn=([^&]+)/);
          if (match) {
            const raw = decodeURIComponent(match[1].replace(/\+/g, ' '));
            titleInput.value = raw.replace(/\.[^/.]+$/, '').replace(/[\._]/g, ' ').trim();
          }
        } else if (val.startsWith('http://') || val.startsWith('https://')) {
          try {
            const path = new URL(val).pathname;
            const fn = path.split('/').filter(Boolean).pop();
            if (fn && !['download', 'get', 'view'].includes(fn.toLowerCase())) {
              titleInput.value = decodeURIComponent(fn).replace(/\.[^/.]+$/, '').replace(/[\._]/g, ' ').trim();
            }
          } catch (e) {}
        }
      }
    });

    // Handle Form Submit
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const token = tokenInput.value.trim();
      const repo = repoInput.value.trim();

      if (!token) {
        alert('Please enter your GitHub Personal Access Token in GitHub Settings.');
        settingsBox.style.display = 'block';
        tokenInput.focus();
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Dispatching to GitHub Actions...';

      statusCard.style.display = 'block';
      statusCard.style.borderLeftColor = '#6366f1';
      statusTitle.innerHTML = '🔄 Dispatching Job...';
      statusMsg.textContent = 'Sending workflow_dispatch request to GitHub API...';
      statusLink.style.display = 'none';

      const payload = {
        ref: 'main',
        inputs: {
          video_url: urlInput.value.trim(),
          video_title: titleInput.value.trim(),
          poster_url: posterInput.value.trim(),
          tags: tagsInput.value.trim(),
          description: descInput.value.trim()
        }
      };

      try {
        const res = await fetch(`https://api.github.com/repos/${repo}/actions/workflows/process_video.yml/dispatches`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/vnd.github+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        if (res.status === 204 || res.ok) {
          statusTitle.innerHTML = '✅ Dispatched to GitHub Actions!';
          statusMsg.textContent = 'Dedicated 7GB RAM Ubuntu Virtual Machine started. Watching run status...';
          statusCard.style.borderLeftColor = '#10b981';

          // Poll for running workflow
          pollWorkflowRun(repo, token);
        } else {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.message || `GitHub returned HTTP ${res.status}`);
        }
      } catch (err) {
        statusCard.style.borderLeftColor = '#ef4444';
        statusTitle.innerHTML = '❌ Dispatch Failed';
        statusMsg.textContent = err.message || 'Failed to dispatch workflow. Verify your token permissions (needs repo & workflow scope).';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>🚀 Dispatch to GitHub Actions (7GB VM)</span>';
      }
    });

    async function pollWorkflowRun(repo, token) {
      let attempts = 0;
      const interval = setInterval(async () => {
        attempts++;
        if (attempts > 30) {
          clearInterval(interval);
          return;
        }

        try {
          const res = await fetch(`https://api.github.com/repos/${repo}/actions/runs?per_page=1`, {
            headers: {
              'Authorization': `Bearer ${token}`,
              'Accept': 'application/vnd.github+json'
            }
          });

          if (res.ok) {
            const data = await res.json();
            if (data.workflow_runs && data.workflow_runs.length > 0) {
              const run = data.workflow_runs[0];
              statusLink.href = run.html_url;
              statusLink.style.display = 'inline-block';
              statusLink.textContent = `👉 View Live VM Terminal Logs (Run #${run.run_number}) ↗`;

              const statusBadge = `<span class="badge badge-${run.status === 'completed' ? run.conclusion : run.status}">${run.status === 'completed' ? run.conclusion : run.status}</span>`;
              statusTitle.innerHTML = `⚡ GitHub Action: ${statusBadge}`;

              if (run.status === 'completed') {
                clearInterval(interval);
                if (run.conclusion === 'success') {
                  statusMsg.textContent = '🎉 Video processed, uploaded to Streamtape, and published to Supabase!';
                  statusCard.style.borderLeftColor = '#10b981';
                } else {
                  statusMsg.textContent = `⚠️ Workflow completed with status: ${run.conclusion}. Check logs for details.`;
                  statusCard.style.borderLeftColor = '#ef4444';
                }
              } else {
                statusMsg.textContent = `Runner active on dedicated Ubuntu VM (${run.name}). Processing video...`;
              }
            }
          }
        } catch (e) {}
      }, 4000);
    }
  </script>
</body>
</html>
